# Nginx da VPS -> containers. Troque SEU-DOMINIO e gere os certificados com:
#   sudo certbot --nginx -d painel.SEU-DOMINIO -d bot.SEU-DOMINIO
# (o certbot acrescenta o "listen 443 ssl" e o redirecionamento HTTP -> HTTPS)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Painel da pizzaria + cardápio público
server {
    listen 80;
    server_name painel.SEU-DOMINIO;

    client_max_body_size 8m;   # fotos de produto (até 5 MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# Bot: só os webhooks públicos (Telegram e OpenPix). O WhatsApp chega
# pela rede interna do Docker e nada mais fica exposto.
server {
    listen 80;
    server_name bot.SEU-DOMINIO;

    location ~ ^/(webhooks/telegram|webhooks/openpix|health)$ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { return 404; }
}
