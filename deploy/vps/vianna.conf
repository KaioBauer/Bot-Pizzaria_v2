# viannapizzaria.online -> container vianna-web (/opt/vianna). Vai em /opt/proxy/sites/vianna.conf.
# Certificado (DNS de viannapizzaria.online e www apontando para a VPS):
#   certbot certonly --webroot -w /var/www/certbot -d viannapizzaria.online -d www.viannapizzaria.online
server {
  listen 443 ssl;
  server_name viannapizzaria.online www.viannapizzaria.online;
  ssl_certificate     /etc/letsencrypt/live/viannapizzaria.online/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/viannapizzaria.online/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;

  # www -> raiz
  if ($host = www.viannapizzaria.online) {
    return 301 https://viannapizzaria.online$request_uri;
  }

  client_max_body_size 8m;   # fotos de produto, camadas e foto da entrega

  # Cardápio, /pedir, painel (/admin) e motoboy (/entrega). O bot não é público.
  set $upstream http://vianna-web:3000;
  location / {
    proxy_pass $upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
  }
}
