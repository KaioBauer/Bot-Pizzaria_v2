# Produção na VPS. O Nginx do servidor faz o HTTPS e encaminha para as portas
# abaixo (publicadas só em 127.0.0.1). Passo a passo em docs/DEPLOY.md.
#
#   cp deploy/.env.example .env                      # variáveis do compose
#   docker compose up -d --build                     # bot + painel
#   docker compose --profile whatsapp up -d --build  # + WhatsApp (Evolution API)
name: vianna

x-logs: &logs
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  bot:
    build: { context: ., dockerfile: apps/bot/Dockerfile }
    env_file: apps/bot/.env
    environment:
      NODE_ENV: production
      PORT: "3001"
      # A Evolution fala com o bot pela rede interna do compose.
      EVOLUTION_URL: http://evolution:8080
    ports: ["127.0.0.1:3001:3001"]
    restart: unless-stopped
    logging: *logs

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?defina no .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?defina no .env}
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports: ["127.0.0.1:3000:3000"]
    restart: unless-stopped
    logging: *logs

  # --- WhatsApp (opcional: --profile whatsapp) -------------------------------------
  evolution:
    profiles: [whatsapp]
    image: evoapicloud/evolution-api:v2.3.7
    depends_on: [evolution-postgres, evolution-redis]
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?defina no .env}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD:?defina no .env}@evolution-postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: vianna
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/6
      CACHE_LOCAL_ENABLED: "false"
      # Webhook global direto para o bot, pela rede interna (não fica exposto).
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://bot:3001/webhooks/whatsapp/${WHATSAPP_WEBHOOK_TOKEN:?defina no .env}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
    volumes: [evolution-instancias:/evolution/instances]
    # Só local: o /manager (ler o QR Code) é acessado por túnel SSH.
    ports: ["127.0.0.1:8080:8080"]
    restart: unless-stopped
    logging: *logs

  evolution-postgres:
    profiles: [whatsapp]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes: [evolution-postgres:/var/lib/postgresql/data]
    restart: unless-stopped

  evolution-redis:
    profiles: [whatsapp]
    image: redis:7-alpine
    volumes: [evolution-redis:/data]
    restart: unless-stopped

volumes:
  evolution-instancias:
  evolution-postgres:
  evolution-redis:
